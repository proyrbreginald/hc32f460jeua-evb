[workspace]
members = ["crates/littlefs"]
resolver = "3"

[package]
name = "hc32f460jeua-evb"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hc32f460"    # 这里决定了编译出来的文件名
path = "src/main.rs" # 程序的入口文件路径
test = false         # 禁用默认测试
doctest = false      # 禁用文档测试
bench = false        # 禁用基准测试

[dependencies]
littlefs = { package = "hc32-littlefs", path = "crates/littlefs" }

[profile.dev]
# 轻量优化，同时保留 debuginfo、帧指针和 panic 栈回溯所需信息。
# 当前 `arm-none-eabi-size` 的 text+data 约为 153.3KiB；结果会随工具链变化。
opt-level = 1
panic = "abort" # 发生 panic 时直接中止，不进行堆栈展开

[profile.release]
# 体积优先; 当前 `arm-none-eabi-size` 的 text+data 约为 96.5KiB。
# 对性能敏感的版本应在真机基准后再改用 opt-level=2/3。
opt-level = "z"
panic = "abort" # 发生 panic 时直接中止，不进行堆栈展开
lto = "fat"     # 全程序 LTO: 跨 crate 消重/内联, 比 thin 再省 ~2KiB (配合 codegen-units=1 体积最优)
codegen-units = 1
