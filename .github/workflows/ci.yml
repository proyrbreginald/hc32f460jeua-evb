name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 最新 stable (不固定具体版本; targets/components 在此声明)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      # lrzsz: zmodem 互通测试的前提 (缺失时相关测试静默跳过)
      - name: Install lrzsz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lrzsz

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      # 与 scripts/verify.sh 保持同一矩阵: fmt + 主机测试 + clippy +
      # debug/release 构建 + 全开配置 (release) 构建与 clippy
      - name: Format check
        run: cargo fmt --all -- --check

      # 主机测试: 纯算法 + littlefs 断电穷举 + 真实 lrzsz 互通
      - name: Host unit tests
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

      # 目标 debug (dev_profile 强制全功能) + release (默认裁剪):
      # 两条路径都编译 selftest/soak/nano, 防止 cfg 门控代码漏检
      - name: Target clippy (debug, 默认配置)
        run: cargo clippy --workspace --target thumbv7em-none-eabihf -- -D warnings

      - name: Target build (debug)
        run: cargo build --target thumbv7em-none-eabihf

      - name: Target build (release, 默认裁剪配置)
        run: cargo build --release --target thumbv7em-none-eabihf

      # 全开配置: release 强制编译所有大功能 (debug 由 dev_profile 恒开)
      - name: Target build (release, 全开配置)
        run: >
          CFG_SHELL_NANO_ENABLE=true
          CFG_SHELL_ZMODEM_ENABLE=true
          CFG_APP_SELFTEST_ENABLE=true
          CFG_SOAK_ENABLE=true
          CFG_CAN_ENABLE=true
          cargo build --release --target thumbv7em-none-eabihf

      - name: Target clippy (release, 全开配置)
        run: >
          CFG_SHELL_NANO_ENABLE=true
          CFG_SHELL_ZMODEM_ENABLE=true
          CFG_APP_SELFTEST_ENABLE=true
          CFG_SOAK_ENABLE=true
          CFG_CAN_ENABLE=true
          cargo clippy --workspace --release --target thumbv7em-none-eabihf -- -D warnings
