[build]
target = "thumbv7em-none-eabihf"

# =====================================================================
# 工程配置 (编译期读取, 见 src/config.rs)
#
# 值均为字符串; 整数在编译期解析并校验, 非法值直接编译报错。
# 修改后重新编译即生效 (cargo 会自动追踪本文件变化并重编译)。
# 注: UART/CAN/LED 的端口 (PortA/PortB/PortC) 编码在代码中, 引脚号可在此配置。
# =====================================================================
[env]
# [board] 芯片型号 / 内核名 (启动横幅与 shell 提示符显示)
CFG_CHIP_MODEL = "HC32F460JEUA"
CFG_CORE = "Cortex-M4F"

# HRC 频率 16|20 MHz (ICG1.HRCFREQSEL, 经 flash 0x404 ICG 配置字生效,
# 复位时硬件载入, 运行期只读)
CFG_HRC_FREQ = "16"
# HRC 复位后是否停止 (ICG1.HRCSTOP): true=停止 (需 clk::hrc_cmd 启动,
# 默认安全) / false=持续振荡 (复位即运行, 无需 hrc_cmd)
CFG_HRC_STOP = "true"
# [clk] 外部晶振频率 (4~25MHz)
CFG_XTAL_HZ = "12000000"
# XTAL 起振配置: 稳定时间 1~9 (≈133µs~32ms, 5=2ms) / 驱动 ulow|low|mid|high
# (RM 4.11.1 建议: 4~8MHz=ulow, 8~16MHz=low, 16~20MHz=mid, 20~25MHz=high)
CFG_XTAL_STABLE_TIME = "5"
CFG_XTAL_DRV = "low"
CFG_XTAL_SUPDRV = "true"    # 起振期超强驱动 (稳定后硬件自动关闭, 不影响功耗)
# MPLL 倍频分频 (PLLCLK = src ÷(m+1) ×(n+1) ÷(p+1); src: 0=XTAL, 1=HRC)
# 12MHz XTAL 方案: M=2 → 4MHz 输入, N=99 → VCO 400MHz, P=1 → 系统 200MHz
# (VCO 240~480MHz、输入 1~25MHz 编译期校验)。12MHz 不能直跑系统时钟:
# CANCLK 固定为 XTAL, 硬件要求 EXCLK ≥ 1.5×CANCLK(18MHz), 而 EXCLK 由
# 系统时钟分频得到, 故系统时钟必须 ≥18MHz。
CFG_PLL_SRC = "0"
CFG_PLL_M = "2"
CFG_PLL_N = "99"
CFG_PLL_P = "1"
CFG_PLL_Q = "1"
CFG_PLL_R = "1"
# 时钟源 (mrc|hrc|xtal|pll)
CFG_CLK_SOURCE = "pll"
# 总线分频 (1/2/4/8/16); 200MHz 方案: HCLK÷1, PCLK0÷1, PCLK1÷2,
# PCLK2/3÷4, PCLK4/EXCLK÷2 (200MHz 下外设总线必须分频!)
CFG_DIV_HCLK = "1"
CFG_DIV_PCLK0 = "1"
CFG_DIV_PCLK1 = "2"
CFG_DIV_PCLK2 = "4"
CFG_DIV_PCLK3 = "4"
CFG_DIV_PCLK4 = "2"
CFG_DIV_EXCLK = "2"

# [systick] SysTick 中断频率 (Hz), RTOS 节拍源
CFG_SYSTICK_HZ = "1000"

# [rtos] 节拍频率 (须与 CFG_SYSTICK_HZ 一致) / 优先级数量 / 空闲线程
CFG_TICKS_PER_SEC = "1000"
CFG_PRIORITY_MAX = "32"
CFG_IDLE_PRIORITY = "31"
CFG_IDLE_STACK = "1024"

# [uart] 控制台 USART: 单元 (1~4) / 引脚复用
# 本板: PC13 = USART3_TX, PH2 = USART3_RX (两者都是 Func_Grp2 引脚;
# 数据手册表 2-2 中 Grp2 的 Func32/33 = USART3_TX/RX; 端口固定在 board.rs)
CFG_UART_UNIT = "3"
CFG_UART_TX_PIN = "13"
CFG_UART_TX_FSEL = "32"
CFG_UART_RX_PIN = "2"
CFG_UART_RX_FSEL = "33"
CFG_UART_BAUDRATE = "115200"
CFG_UART_OVERSAMPLE = "8"       # 8 或 16
CFG_UART_CLOCK_DIV = "1"        # 1/4/16/64
CFG_UART_DATA_BITS = "8"        # 8/9 (带校验时 8 = 7 数据 + 1 校验)
CFG_UART_PARITY = "none"        # none/even/odd
CFG_UART_STOP_BITS = "1"        # 1/2
CFG_UART_FIRST_BIT = "lsb"      # lsb/msb
CFG_UART_START_POLARITY = "falling" # falling/low (DDL 默认下降沿)
CFG_UART_FLOW_CTRL = "none"     # none/cts (RTS 为 F460 默认行为)
CFG_UART_NOISE_FILTER = "false" # 噪声滤波 (三取二采样)
CFG_UART_RX_BUF_SIZE = "512"    # 中断接收环形缓冲 (字节)
CFG_UART_IRQ_CHANNEL = "1"      # INTC 通道 INT000~INT007
CFG_UART_IRQ_PRIORITY = "8"     # NVIC 抢占优先级 0~15 (越小越高)

# [dma] 直接内存访问 (DMA1/DMA2, 每单元 4 通道)
# 控制台 UART 发送卸载: 输出长度 ≥ CFG_DMA_TX_MIN 时整块交给 DMA
# (USART{CFG_UART_UNIT}_TI 事件触发), 发送期间 CPU 不再逐字节轮询 TXE,
# 长输出 (zmodem sz / cat / soak 报告) 不再长时间占用 CPU 时间。
# 通道忙 / 输出过短 / 中断上下文时自动回退逐字节轮询, 行为不变。
CFG_DMA_ENABLE = "true"              # 启用 DMA 驱动与控制台 TX 卸载
CFG_DMA_TX_UNIT = "2"                # 控制台 TX DMA 单元 (1/2)
CFG_DMA_TX_CHANNEL = "0"             # 控制台 TX DMA 通道 (0~3)
CFG_DMA_TX_MIN = "16"                # 触发 DMA 的最小输出长度 (字节)
# 大块拷贝 (Flash→RAM 读/擦除校验/写后回读) 专用通道; 不得与 TX 通道
# 相同 (编译期校验)。阈值以下的读取保持逐字节/逐字回退 (DMA 单次配置
# 开销 ~10µs, 小块反而更慢)。
CFG_DMA_COPY_UNIT = "1"              # 大块拷贝 DMA 单元 (1/2)
CFG_DMA_COPY_CHANNEL = "0"           # 大块拷贝 DMA 通道 (0~3)
CFG_DMA_COPY_MIN = "256"             # 触发 DMA 整块拷贝的最小长度 (字节)

# [can] HC32F460 单路经典 CAN 2.0B
# 本板 CAN 引脚 PB9(TX)/PB8(RX) 直接引出，没有板载 CAN 收发器；正常模式需外接 PHY。
# CANCLK 固定为 XTAL；编译期校验 EXCLK>=1.5*CANCLK、<=1Mbit/s 位时序，
# 且按 RM 建议不使用 SBT.PRESC=0 (实际预分频 1)。
#
# 1 Mbit/s @ 12MHz XTAL: 一位恰好 12 个 CANCLK, 搜索结果为 PRESC=3、SEG1=3、
# SEG2=1、SJW=1 (共 4 TQ = 1µs, 采样点 75%, 误差 0ppm)。SJW=1 是 75% 采样点
# 的前提: SJW=2 时 SEG2 ≥ 2、一位至少 5 TQ, 无法整除 12 个 CANCLK (只能退到
# PRESC=2/6 TQ/66.7%)。1 Mbit/s 总线长度上限约 40m (ISO 11898-2), 两端各
# 120Ω 终端; 采样点与 SJW 需与总线对端一致。
CFG_CAN_ENABLE = "true"                 # true: 启动时初始化应用 CAN, 并编译 shell `can` 测试命令
                                         # (关闭时 CAN 驱动与 `can` 命令都不参与链接, 省 ~11.5 KiB)
CFG_CAN_SELFTEST_ENABLE = "true"         # selftest/soak 的 CAN 内部回环项 (应用 CAN
                                         # 占用控制器时自动接管, 结束后按原模式恢复)
CFG_CAN_TX_PIN = "9"                     # PortB Func_Grp2，PB9 Func50 = CAN_TxD
CFG_CAN_TX_FSEL = "50"
CFG_CAN_RX_PIN = "8"                     # PortB Func_Grp2，PB8 Func51 = CAN_RxD
CFG_CAN_RX_FSEL = "51"
CFG_CAN_BITRATE = "1000000"              # 1 Mbit/s (经典 CAN 上限)
CFG_CAN_SAMPLE_POINT_PERMILLE = "750"    # 750 = 75.0%
CFG_CAN_SJW = "1"                        # 1~8 TQ，且不大于 TimeSeg2
                                         # (见上方 1Mbit/s 位时序说明)
CFG_CAN_MAX_BITRATE_ERROR_PPM = "10000"  # 10000 = 1%
CFG_CAN_MODE = "normal"                  # normal|silent|internal-loopback|external-loopback|external-loopback-silent
CFG_CAN_PTB_SINGLE_SHOT = "false"        # false = 自动重发
CFG_CAN_STB_SINGLE_SHOT = "false"
CFG_CAN_STB_PRIORITY = "fifo"            # fifo|id (低 ID 优先)
CFG_CAN_RX_WARN_LIMIT = "10"             # RX FIFO 共 10 槽，范围 1~10
CFG_CAN_ERROR_WARN_LIMIT = "7"           # 实际阈值 (value+1)*8，范围 0~15
CFG_CAN_RX_ALL_FRAMES = "false"          # 是否接收含错误的帧
CFG_CAN_RX_OVERFLOW = "discard-newest"   # discard-newest|overwrite-oldest
CFG_CAN_SELF_ACK = "false"               # 仅外部回环生效；内部回环自动 ACK
# 单个启动配置筛选器；驱动 API 支持最多 8 个。mask 位 1 表示忽略对应 ID 位。
CFG_CAN_FILTER_ID = "0x0"
CFG_CAN_FILTER_MASK = "0x1FFF_FFFF"       # 默认接受全部 ID
CFG_CAN_FILTER_TYPE = "both"              # both|standard|extended
CFG_CAN_TIMEOUT_MS = "100"

# [gpio] 板载 LED (PortB 固定在 board.rs; 三者都是高电平点亮)
# WORK=运行心跳, SUCCESS=启动完成, ERROR=panic/fault 或自检/soak 失败
CFG_LED_WORK_PIN = "12"      # PB12 = LED_WORK
CFG_LED_SUCCESS_PIN = "14"   # PB14 = LED_SUCCESS
CFG_LED_ERROR_PIN = "13"     # PB13 = LED_ERROR
CFG_LED_ACTIVE_LEVEL = "high" # high = 高电平点亮 / low = 低电平点亮

# [shell] 终端登录 (改密码无需改代码)
CFG_SHELL_USERNAME = "root"
CFG_SHELL_PASSWORD = "root"
CFG_SHELL_LOGIN_TRIES = "3"    # 登录失败允许次数
CFG_SHELL_LINE_BUF = "128"     # 输入行缓冲区 (字节)
CFG_SHELL_HISTORY_SIZE = "8"   # RAM 中保留的历史命令条数 (重启后清空)
# 启用的命令列表 (逗号分隔, 见 src/shell.rs 命令表; 未列出的命令提示未启用)
CFG_SHELL_COMMANDS = "help,sysinfo,uptime,ps,free,echo,history,pwd,cd,ls,mkdir,rmdir,cat,write,rm,mv,stat,df,fsck,level,mount,mkfs,led,can,log,sz,rz,clear,whoami,reboot,logout"

# 功能编译期开关 (true/false): false 时对应命令与其全部代码不编译, 直接省
# FLASH。注意: soak 依赖 selftest 的 ESC 中断支持, soak=true 时 selftest
# 自动随带编译 (build.rs 强制), 与 CFG_APP_SELFTEST_ENABLE 取值无关。
CFG_SHELL_NANO_ENABLE = "false"      # nano 全屏编辑器 (省 ~8 KiB; 业务运行不需)
CFG_SHELL_ZMODEM_ENABLE = "true"     # sz/rz 文件传输 (省 ~7 KiB + CRC 表)

# [nano] 轻量全屏文本编辑器 (ASCII, ANSI 终端; 行列为自动探测失败时的回退值)
CFG_NANO_COLUMNS = "80"
CFG_NANO_ROWS = "24"
CFG_NANO_MAX_BYTES = "16384"      # 单文件编辑上限 (≤ 65472 = 快照容量)

# [zmodem] ZMODEM 文件传输 (shell `sz` 发送 / `rz` 接收)
CFG_ZMODEM_TIMEOUT_MS = "10000"   # 帧/字节间等待超时 (毫秒, 对齐 lrzsz 默认 10s)
CFG_ZMODEM_SUBPACKET = "1024"     # 发送子包长度 (字节, 32~1024)
CFG_ZMODEM_RX_MAX = "16384"       # 接收文件大小上限 (字节, 快照容量 64KiB 减去开销)

# [log] 应用日志 (可开关+分级+彩色, 与内核打印分离)
CFG_LOG_ENABLE = "true" # 日志默认开关 (运行时可用 shell `log on|off` 切换)
CFG_LOG_LEVEL = "info"  # 默认级别阈值 error/warn/info/debug/trace (输出 ≤ 阈值)
CFG_LOG_COLOR = "true"  # 控制台 ANSI 颜色 (false=纯文本; 落盘文件恒为无色)

# [logfile] 日志自动保存到 /log/ (shell `log file on|off` 可运行时切换)
CFG_LOG_FILE_ENABLE = "true"   # 落盘开关
CFG_LOG_RING = "16384"         # RAM 日志缓冲 (字节; 满时丢最旧, 掉电丢失)
CFG_LOG_FILE_MAX = "4096"      # 单个日志文件上限 (字节; 超出则写入下一段文件)
CFG_LOG_FILE_SLOTS = "4"       # 保留的日志文件数 (boot_<序号>[_<段号>].log)
# 快照文件系统每次提交都重写整个快照并回收旧扇区 (含擦除), 刷新间隔
# 即提交频率: 持续打日志时 2s 间隔约 5.4k~10.8k 次擦除/扇区/天 (数据手册
# 表 3-56 最小 10k 次), 30s 间隔约 360~720 次/扇区/天。掉电丢失窗口
# = 刷新间隔 + RAM 缓冲 (非 reboot 路径), 按现场可容忍度折中。
CFG_LOG_FLUSH_MS = "30000"     # 落盘线程刷新间隔 (毫秒; 越小越费 Flash)
CFG_APP_LOGFILE_STACK = "8192" # 落盘线程栈 (与 shell 同级: 文件系统写 + 格式化较深)
CFG_APP_LOGFILE_PRIORITY = "3" # 低于 shell(1)/led(2), 高于 idle(31)
CFG_APP_LOGFILE_TIMESLICE = "10"

# [console] 控制台输出节流 (防 USB 转串口突发丢字节)
CFG_CONSOLE_LINE_GAP_MS = "8"  # 每行输出后的间隙 (毫秒; 0=不节流)

# [panic] panic/fault 后的行为策略
CFG_PANIC_STRATEGY = "halt"    # halt=停机 (调试期, gdb 现场检查) / reset=软复位 (产品)

# [panic] panic/fault 诊断文本详细度: true=逐位解码 CFSR/HFSR 原因名
# (调试期), false=仅输出寄存器原始值 (参考手册查表, 省 ~1.5KiB)
CFG_PANIC_VERBOSE = "false"

# [soak_report] soak 测试报告 (/test/ 目录保留文件数)
CFG_TEST_REPORT_SLOTS = "1"

# [rtc] 实时时钟 (LRC 源), 同时作为日志时间戳 (天:时:分:秒)
CFG_RTC_ENABLE = "true" # 启用时开机初始化并走时

# [wdt] MCU **内部**看门狗 (最高优先级 supervisor 周期喂狗; 调试/烧录期建议关闭)
# 注意: 内部 WDT 在调试器停机期间继续计数, 长时间擦除会被它复位打断烧录。
CFG_WDT_ENABLE = "false"
CFG_WDT_STACK = "512"
CFG_WDT_PRIORITY = "0"
CFG_WDT_FEED_MS = "500"

# [hwdt] 板载**外部**硬件看门狗 (与上面的内部 WDT 相互独立, 需主控主动喂)
# 硬件语义: PB4 输出高电平禁用 / 低电平使能; 使能期间 PB5 必须在 1s 周期内
# 给出一次电平跳变 (喂狗), 否则外部看门狗复位主控。上电后 PB4 为输入态,
# 板载看门狗默认处于使能状态, 因此启动阶段会**先把 PB4 拉高禁用**再决定。
# false = 启动即禁用且不创建喂狗线程 (烧录/调试必须;
#         调试器停机时无法喂狗, 使能状态下会不断复位导致烧录失败);
# true  = 启动即使能并创建喂狗线程 (产品部署)。
CFG_HWDT_ENABLE = "false"
CFG_HWDT_ENABLE_PIN = "4"    # PB4 使能控制 (高=禁用, 低=使能)
CFG_HWDT_FEED_PIN = "5"      # PB5 喂狗 (每次喂狗翻转一次电平)
CFG_HWDT_FEED_MS = "1500"    # 喂狗周期 (硬件要求 ≤1500ms; 余量不足可用 500)
CFG_HWDT_STACK = "512"       # 喂狗线程栈
CFG_HWDT_PRIORITY = "0"      # 喂狗线程优先级 (须高于所有应用线程)

# [mpu] 内存保护单元 (FLASH 只读 + SRAM/外设 XN + 线程栈守卫, 默认开启)
CFG_MPU_ENABLE = "true"
# 栈守卫区大小 (字节, 2 的幂 32~1024): 线程栈底 + 主栈(ISR)下方各一块无访问
# 区域, 向下溢出立即 MemManage 故障。须与 link.ld 的 MPU_GUARD_SIZE 一致
# (build.rs 编译期校验); 越大预警区越宽, 每线程栈开销 = 守卫大小。
CFG_MPU_STACK_GUARD = "32"

# [app] 演示线程参数 (栈/优先级/时间片) 与周期定时器
# 是否启用内核自检 (true/false); 编译期开关: false 时 selftest 命令与其
# 全部代码不编译, 直接省 FLASH (soak 开启时自动随带编译, 见 build.rs)
CFG_APP_SELFTEST_ENABLE = "false"
CFG_APP_SHELL_STACK = "8192"     # 自检在 shell 线程内同步执行, 需更大栈 (调试格式化机器栈较深)
CFG_APP_SHELL_PRIORITY = "1"
CFG_APP_SHELL_TIMESLICE = "10"
CFG_APP_TIMER_PERIOD_MS = "2000"
CFG_APP_LED_STACK = "512"     # LED 日志路径 (log 宏含控制台+落盘环两段格式化)
CFG_APP_LED_PRIORITY = "2"
CFG_APP_LED_TIMESLICE = "10"
CFG_APP_LED_BLINK_MS = "500"

# [soak] 长期稳定性测试 (shell `soak` 命令, 同步执行)
# 编译期开关: false 时 soak 命令与其全部代码 (含 HTML 报告模板) 不编译,
# 直接省 FLASH
CFG_SOAK_ENABLE = "false"            # 命令开关 (false 时命令不注册; 业务运行不需)
CFG_SOAK_MINUTES = "10"              # soak 无参数时的默认时长 (分钟, 0 = 直到 ESC)
CFG_SOAK_REPORT_INTERVAL_MS = "30000" # 进度报告间隔 (毫秒)
CFG_SOAK_HANG_GRACE_MS = "5000"      # 压力线程心跳停滞判定 (毫秒)
CFG_SOAK_FLASH_INTERVAL_MS = "10000" # Flash 压力节流: 两次擦写循环的最小间隔 (毫秒)
# 硬实时判定阈值 (实测峰值超过即 FAIL):
# 最长关中断 (PRIMASK) 时间 / 最长 SysTick ISR 到达延迟 (不含 Flash bus hold)
CFG_SOAK_MAX_CRITICAL_US = "50"
CFG_SOAK_MAX_IRQ_LATENCY_US = "500"

[target.thumbv7em-none-eabihf]
rustflags = [
  "-C",
  "link-arg=-Tlink.ld",                                    # 使用自定义链接脚本
  "-C",
  "link-arg=--gc-sections",                                # 垃圾回收未引用段 (本工程实测体积无变化: LLVM 已先行 DCE)
  "-C",
  "link-arg=-Map=target/thumbv7em-none-eabihf/output.map", # 生成链接映射文件
  "-C",
  "force-frame-pointers=true",                             # 全量帧指针, 供 panic/fault 栈回溯
]

# cargo run 时把构建产物交给烧录脚本 (构建 -> 复制 .elf -> pyocd 烧录)
runner = ["bash", "scripts/flash.sh"]
